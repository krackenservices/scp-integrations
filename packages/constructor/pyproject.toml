[project]
name = "scp-constructor"
version = "0.3.0"
description = "Build architecture graphs from scp.yaml files - SDK-powered rewrite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scp-sdk>=0.1.0",
    "typer>=0.9",
    "rich>=13.0",
    "neo4j>=5.0",
    "httpx>=0.25",
]

[project.scripts]
scp-cli = "scp_constructor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scp_constructor"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.9",
]

[tool.uv.sources]
scp-sdk = { path = "../../../scp-sdk", editable = true }
