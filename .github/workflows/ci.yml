name: CI/CD

on:
  push:
    branches: ["main"]
    tags:
      - "constructor-v*"
      - "servicenow-v*"
  pull_request:
    branches: ["main"]

jobs:
  # Detect which packages changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      constructor: ${{ steps.filter.outputs.constructor }}
      servicenow: ${{ steps.filter.outputs.servicenow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            constructor:
              - 'packages/constructor/**'
            servicenow:
              - 'packages/vendor/servicenow/**'

  # Constructor Workflow
  constructor:
    name: Constructor
    needs: changes
    if: ${{ needs.changes.outputs.constructor == 'true' || startsWith(github.ref, 'refs/tags/constructor-v') }}
    uses: ./.github/workflows/constructor.yml
    secrets: inherit

  # ServiceNow CMDB Workflow
  servicenow:
    name: ServiceNow CMDB
    needs: changes
    if: ${{ needs.changes.outputs.servicenow == 'true' || startsWith(github.ref, 'refs/tags/servicenow-v') }}
    uses: ./.github/workflows/servicenow.yml
    secrets: inherit
