name: ServiceNow Workflow

on:
  workflow_call:

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vendor/servicenow

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: .
        run: uv sync --all-groups

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Sync Project Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/servicenow-v* ]]; then
            VERSION=${GITHUB_REF_NAME#servicenow-v}
            echo "Type: Tagged Release"
          else
            LAST_TAG=$(git tag -l 'servicenow-v*' --sort=-v:refname | head -n1)
            if [ -z "$LAST_TAG" ]; then
              LAST_TAG="servicenow-v0.0.0"
            fi
            VERSION="${LAST_TAG#servicenow-v}-dev"
            echo "Type: Dev Build (Last tag: $LAST_TAG)"
          fi

          echo "Syncing pyproject.toml to version: $VERSION"
          uv version "$VERSION"
          uv version

      - name: Build package
        working-directory: .
        run: uv build --package scp-servicenow

      - name: Upload Build Artifact
        if: startsWith(github.ref, 'refs/tags/servicenow-v')
        uses: actions/upload-artifact@v4
        with:
          name: servicenow-dist
          path: dist/*
          retention-days: 1

  publish:
    name: Publish
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/servicenow-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: servicenow-dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
