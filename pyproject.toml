[project]
name = "scp-integrations-workspace"
version = "0.1.0"
description = "SCP Integrations Monorepo Workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest",
    "pytest-cov",
    "pytest-httpx",
    "pytest-mock",
    "ruff",
    "scp-constructor",
    "scp-servicenow",
]

[project.scripts]
scp-cli = "scp_constructor.cli:app"

[tool.uv.workspace]
members = ["packages/*", "packages/vendor/servicenow"]
exclude = []

[tool.uv.sources]
scp-constructor = { workspace = true }
scp-servicenow = { workspace = true }
